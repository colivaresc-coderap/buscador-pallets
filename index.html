<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buscador Pro CS</title>
  <style>
    :root {
      --bg-dark: #09090b; --bg-panel: #18181b; --accent: #22c55e;
      --text-main: #fafafa; --text-muted: #a1a1aa; --border: #27272a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background-color: var(--bg-dark); color: var(--text-main);
      margin: 0; padding: 15px; display: flex; flex-direction: column;
      align-items: center; min-height: 100vh;
    }
    
    .lang-container { display: flex; gap: 10px; margin-bottom: 25px; width: 100%; max-width: 360px; }
    .lang-btn {
      flex: 1; padding: 14px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--bg-panel); color: var(--text-muted); cursor: pointer;
      font-weight: bold; font-size: 13px; transition: 0.2s;
    }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(34, 197, 94, 0.1); }

    #btnMic {
      width: 115px; height: 115px; border-radius: 50%; border: 4px solid var(--accent);
      background: var(--bg-panel); color: var(--accent); font-size: 55px;
      margin-bottom: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;
    }
    .mic-active { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }

    .label-ui { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

    input[type="tel"] {
      width: 100%; max-width: 360px; background-color: var(--bg-panel);
      border: 2px solid var(--border); color: var(--accent);
      font-size: 55px; font-weight: 800; padding: 12px;
      border-radius: 15px; text-align: center; outline: none; margin-bottom: 20px;
    }

    #listaResultados { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 15px; }
    .card { background-color: var(--bg-panel); border-radius: 20px; border: 2px solid var(--border); padding: 25px; text-align: center; cursor: pointer; transition: background-color 0.3s, transform 0.1s; }
    .card:active { transform: scale(0.98); }
    
    .color-0 { border-color: var(--accent); } 
    .color-1 { border-color: #facc15; color: #facc15; } 
    .color-2 { border-color: #3b82f6; color: #3b82f6; } 
    .color-3 { border-color: #ef4444; color: #ef4444; } 

    .card-success { background-color: #166534 !important; border-color: #22c55e !important; color: white !important; }
    .card-success .card-value, .card-success .extra-field, .card-success .progress-txt { color: white !important; }

    .card-value { font-size: 85px; font-weight: 900; line-height: 1; margin: 5px 0; }
    .progress-txt { font-size: 26px; font-weight: 800; margin: 10px 0; color: var(--text-main); }
    .extra-field { font-size: 20px; font-weight: bold; opacity: 0.9; }
    #status { font-size: 10px; color: var(--text-muted); margin-top: 20px; text-align: center; }
    #btnSensor { display: none; background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 10px; margin-bottom: 15px; width: 100%; max-width: 360px; }
  </style>
</head>
<body>

  <button id="btnSensor">ACTIVAR SENSOR DE MOVIMIENTO (SHAKE)</button>

  <div class="lang-container">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en-US', this)">ENGLISH</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es-MX', this)">ESPAÑOL</button>
  </div>

  <button id="btnMic">🎤</button>
  
  <div class="label-ui" id="ui-label">Enter last 4 digits.</div>
  <input type="tel" id="inputNum" maxlength="4" placeholder="----" oninput="buscar()" onclick="resetUI()">

  <div id="listaResultados"></div>
  <div id="status">Syncing database...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzJY1htCBjdSjmGISM705ehfzDbUV1OFpRrSEhgF8IqoD0dVk2vJVb6bYeUmsRuEjo9/exec";
    
    let db = [];
    let currentLang = 'en-US';
    let lastShake = 0;
    let listaCoindicenciasActuales = [];
    let estaBloqueado = false;
    
    const translations = {
      'en-US': { label: 'Enter last 4 digits', ready: 'Ready: ', notFound: 'Not Found', multiple: 'Multiple!', complete: 'Order Complete', updating: 'Updating...', connector: ' of ' },
      'es-MX': { label: 'Digitar 4 últimos', ready: 'Listo: ', notFound: 'No Encontrado', multiple: '¡Varios!', complete: 'Completado', updating: 'Actualizando...', connector: ' de ' }
    };

    const input = document.getElementById("inputNum");
    const lista = document.getElementById("listaResultados");
    const status = document.getElementById("status");
    const btnMic = document.getElementById("btnMic");

    window.onload = async () => {
      try {
        const resp = await fetch(API_URL);
        db = await resp.json();
        updateStatus();
        initShake();
      } catch (e) { status.innerText = "CONNECTION ERROR"; }
    };

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    recognition.onstart = () => { if(!estaBloqueado) btnMic.classList.add('mic-active'); };
    recognition.onend = () => { btnMic.classList.remove('mic-active'); };
    
    recognition.onresult = (e) => {
      if(estaBloqueado) return;
      const texto = e.results[0][0].transcript.toUpperCase();
      if (texto.includes("AGA") || texto.includes("AGX")) return;

      const num = texto.replace(/\D/g, "").slice(-4);
      if (num && num.length === 4) { 
        input.value = num; 
        buscar(); 
      }
    };

    function activarMicrofono() {
      if(estaBloqueado) return;
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
      try { recognition.start(); } catch(e) { recognition.stop(); }
    }

    function initShake() {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        document.getElementById("btnSensor").style.display = "block";
        document.getElementById("btnSensor").onclick = () => {
          DeviceMotionEvent.requestPermission().then(res => {
            if (res == 'granted') window.addEventListener('devicemotion', handleMotion);
          });
        };
      } else { window.addEventListener('devicemotion', handleMotion); }
    }

    function handleMotion(e) {
      if(estaBloqueado) return;
      let acc = e.accelerationIncludingGravity;
      if (Math.abs(acc.x) > 15 || Math.abs(acc.y) > 15) {
        let now = Date.now();
        if (now - lastShake > 2000) { 
          lastShake = now; 
          if(listaCoindicenciasActuales.length === 1) {
            confirmarCaja(listaCoindicenciasActuales[0].idFila);
          } else {
            activarMicrofono(); 
          }
        }
      }
    }

    document.addEventListener('keydown', (e) => { 
      if (e.key === "F4") { e.preventDefault(); activarMicrofono(); }
    });

    function setLang(lang, btn) {
      if(estaBloqueado) return;
      currentLang = lang;
      recognition.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('ui-label').innerText = translations[currentLang].label;
      updateStatus();
      resetUI();
    }

    function updateStatus() { status.innerText = translations[currentLang].ready + db.length + " pallets"; }
    function resetUI() { if(!estaBloqueado) { input.value = ''; lista.innerHTML = ''; listaCoindicenciasActuales = []; } }

    function buscar() {
      if(estaBloqueado) return;
      const val = input.value;
      if (val.length === 4) {
        btnMic.classList.remove('mic-active');
        listaCoindicenciasActuales = db.filter(row => row.full.endsWith(val));
        lista.innerHTML = "";
        
        if (listaCoindicenciasActuales.length > 0) {
          listaCoindicenciasActuales.forEach((item, index) => {
            const colorClass = `color-${index % 4}`; 
            const esCompleto = item.actual >= item.cant;
            const extraClase = esCompleto ? 'card-success' : colorClass;

            lista.innerHTML += `
              <div class="card ${extraClase}" id="card-${item.idFila}" onclick="confirmarCaja(${item.idFila})">
                <div style="font-size: 13px; opacity: 0.8;">${item.full}</div>
                <div class="card-value">${item.val}</div>
                <div class="progress-txt" id="progreso-${item.idFila}">${item.actual} / ${item.cant}</div>
                <div class="extra-field">${item.extra}</div>
              </div>`;
          });
          
          // LA CORRECCIÓN AQUÍ: Si hay múltiples dice "¡Varios!", si hay uno solo dice el nombre del pallet (ej: "P6")
          if (listaCoindicenciasActuales.length > 1) hablar(translations[currentLang].multiple);
          else hablar(listaCoindicenciasActuales[0].val);
          
          input.blur();
        } else {
          lista.innerHTML = `<div class="card" style="border-color:#ef4444"><div class="card-value" style="color:#ef4444; font-size:30px;">${translations[currentLang].notFound}</div></div>`;
          hablar(translations[currentLang].notFound);
        }
      }
    }

    async function confirmarCaja(idIndexColumnaT) {
      if(estaBloqueado) return;
      
      const item = db.find(row => row.idFila === idIndexColumnaT);
      if (!item) return;

      estaBloqueado = true; 
      status.innerText = translations[currentLang].updating;

      try {
        const respuesta = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" }, 
          body: JSON.stringify({ idFila: item.idFila, cant: item.cant })
        });
        
        const resultadoJson = await respuesta.json();
        
        if (resultadoJson.success) {
          item.actual = resultadoJson.nuevoActual;
          
          const elementoProgreso = document.getElementById(`progreso-${idIndexColumnaT}`);
          if(elementoProgreso) elementoProgreso.innerText = `${item.actual} / ${item.cant}`;

          if (item.actual >= item.cant) {
            const tarjeta = document.getElementById(`card-${idIndexColumnaT}`);
            if(tarjeta) tarjeta.className = "card card-success"; 
            
            ejecutarTonoExito();
            
            const fraseCompleta = item.actual.toString() + translations[currentLang].connector + item.cant.toString();
            hablar(fraseCompleta + ". " + translations[currentLang].complete);

            setTimeout(() => {
              estaBloqueado = false;
              updateStatus();
              resetUI();
            }, 3000);

          } else {
            const fraseProgreso = item.actual.toString() + translations[currentLang].connector + item.cant.toString();
            hablar(fraseProgreso);
            
            estaBloqueado = false;
            updateStatus();
            resetUI();
          }
        } else {
          estaBloqueado = false;
          updateStatus();
          alert("Error: " + resultadoJson.error);
        }

      } catch (err) {
        estaBloqueado = false;
        updateStatus();
        console.error("Error de conexión:", err);
      }
    }

    function ejecutarTonoExito() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); 
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function hablar(mensaje) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(mensaje);
      msg.lang = currentLang;
      msg.pitch = 0.8;
      setTimeout(() => window.speechSynthesis.speak(msg), 50);
    }

    btnMic.onclick = activarMicrofono;
  </script>
</body>
</html>
