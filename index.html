<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --bg-dark: #09090b; --bg-panel: #18181b; --accent: #22c55e;
      --text-main: #fafafa; --text-muted: #a1a1aa; --border: #27272a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background-color: var(--bg-dark); color: var(--text-main);
      margin: 0; padding: 15px; display: flex; flex-direction: column;
      align-items: center; min-height: 100vh;
    }
    
    .lang-container { display: flex; gap: 10px; margin-bottom: 25px; width: 100%; max-width: 360px; }
    .lang-btn {
      flex: 1; padding: 14px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--bg-panel); color: var(--text-muted); cursor: pointer;
      font-weight: bold; font-size: 13px; transition: 0.2s;
    }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(34, 197, 94, 0.1); }

    #btnMic {
      width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--accent);
      background: var(--bg-panel); color: var(--accent); font-size: 45px;
      margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;
    }
    .mic-active { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }

    .label-ui { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

    input[type="tel"] {
      width: 100%; max-width: 360px; background-color: var(--bg-panel);
      border: 2px solid var(--border); color: var(--accent);
      font-size: 55px; font-weight: 800; padding: 12px;
      border-radius: 15px; text-align: center; outline: none; margin-bottom: 20px;
    }

    #listaResultados { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 15px; }
    .card {
      background-color: var(--bg-panel); border-radius: 20px; border: 1px solid var(--border); 
      padding: 25px; text-align: center; animation: slideUp 0.2s ease;
    }
    .card-value { font-size: 80px; font-weight: 900; line-height: 1; margin: 10px 0; }
    #status { font-size: 10px; color: var(--text-muted); margin-top: 20px; text-align: center; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="lang-container">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en-US', this)">ENGLISH</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es-MX', this)">ESPAÑOL</button>
  </div>

  <button id="btnMic">🎤</button>
  
  <div class="label-ui" id="ui-label">Enter last 4 digits</div>
  <input type="tel" id="inputBusqueda" maxlength="4" placeholder="----" oninput="buscar()" onclick="resetUI()">

  <div id="listaResultados"></div>
  <div id="status">Syncing database...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzJY1htCBjdSjmGISM705ehfzDbUV1OFpRrSEhgF8IqoD0dVk2vJVb6bYeUmsRuEjo9/exec";
    
    let db = [];
    let currentLang = 'en-US';
    
    const translations = {
      'en-US': { label: 'Enter last 4 digits', ready: 'Ready: ', notFound: 'Not Found', items: 'pallets', multiple: 'Multiple found!' },
      'es-MX': { label: 'Digitar 4 últimos', ready: 'Listo: ', notFound: 'No Encontrado', items: 'pallets', multiple: '¡Varios encontrados!' }
    };

    const input = document.getElementById("inputBusqueda");
    const lista = document.getElementById("listaResultados");
    const status = document.getElementById("status");
    const btnMic = document.getElementById("btnMic");

    window.onload = async () => {
      try {
        const resp = await fetch(API_URL);
        db = await resp.json();
        updateStatus();
      } catch (e) { status.innerText = "CONNECTION ERROR"; }
    };

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    recognition.onstart = () => { btnMic.classList.add('mic-active'); precalentarVoz(); };
    recognition.onend = () => btnMic.classList.remove('mic-active');
    
    recognition.onresult = (e) => {
      const texto = e.results[0][0].transcript;
      const num = texto.replace(/\D/g, "").slice(-4);
      if (num) { input.value = num; buscar(); }
    };

    function precalentarVoz() {
      const dummy = new SpeechSynthesisUtterance("");
      window.speechSynthesis.speak(dummy);
    }

    function setLang(lang, btn) {
      currentLang = lang;
      recognition.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('ui-label').innerText = translations[currentLang].label;
      updateStatus();
      resetUI();
    }

    function updateStatus() {
      status.innerText = translations[currentLang].ready + db.length + " " + translations[currentLang].items;
    }

    function resetUI() {
      input.value = '';
      lista.innerHTML = '';
      precalentarVoz();
    }

    function buscar() {
      const val = input.value;
      const t = translations[currentLang];
      
      if (val.length === 4) {
        // LA CLAVE: Usamos filter en lugar de find para traer todos los repetidos
        const coincidencias = db.filter(row => row.full.endsWith(val));
        lista.innerHTML = "";
        
        if (coincidencias.length > 0) {
          coincidencias.forEach(item => {
            lista.innerHTML += `
              <div class="card">
                <div style="color: var(--text-muted); font-size: 13px;">${item.full} (${item.cant})</div>
                <div class="card-value">${item.val}</div>
              </div>`;
          });
          
          // Si hay más de uno, avisamos por voz que hay varios
          if (coincidencias.length > 1) {
            hablar(t.multiple);
          } else {
            hablar(coincidencias[0].val); 
          }
          input.blur();
        } else {
          lista.innerHTML = `<div class="card" style="border-color:#ef4444"><div class="card-value" style="color:#ef4444; font-size:30px;">${t.notFound}</div></div>`;
          hablar(t.notFound);
        }
      }
    }

    function hablar(mensaje) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(mensaje);
      msg.lang = currentLang;
      msg.pitch = 0.8;
      msg.rate = 1.0;
      setTimeout(() => window.speechSynthesis.speak(msg), 50);
    }

    btnMic.onclick = () => { 
      precalentarVoz(); 
      try { recognition.start(); } catch(e) { recognition.stop(); } 
    };
  </script>
</body>
</html>
